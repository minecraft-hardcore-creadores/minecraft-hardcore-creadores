<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Creadores participantes | Minecraft Hardcore</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color-scheme:light}*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#20232a}main{max-width:680px;margin:56px auto;padding:0 20px 40px}h1{font-size:clamp(1.55rem,4vw,2rem);margin:0 0 8px}p{color:#59616b;margin:0 0 20px}ul{list-style:none;padding:0;margin:0;display:grid;gap:9px}li a{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 17px;background:white;border:1px solid #dfe3e8;border-radius:9px;color:#26222e;text-decoration:none;overflow-wrap:anywhere}li a:hover,li a:focus-visible{border-color:#7952cc;background:#f9f6ff;outline-offset:2px}.name{font-weight:600;overflow-wrap:anywhere}.status{font-size:.76rem;white-space:nowrap;color:#69717c}.live .status{color:#16763c;font-weight:700}.live a{border-color:#b5dec3}.toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:14px;flex-wrap:wrap}.toolbar small{color:#69717c}button{border:1px solid #dfe3e8;background:white;border-radius:7px;padding:8px 12px;cursor:pointer}footer{margin-top:24px;font-size:.85rem;color:#707780}
</style>
</head>
<body><main>
<h1>Creadores participantes – Minecraft Hardcore</h1>
<p>Canales de Twitch de los participantes. Los canales en directo aparecen primero cuando la consulta está disponible.</p>
<div class="toolbar"><small id="info" role="status" aria-live="polite">Preparando listado…</small><button id="refresh" type="button">Actualizar</button></div>
<ul id="channels"></ul>
<footer>Listado informativo de canales · Página editable y no oficial</footer>
</main>
<script>
// Modifica estos nombres para agregar o quitar participantes.
const channels=['tegertiyt','derpysnak','srdannyry','theredshot','fairewall','lnferaura','benya_vt','kyori_vt','sp4nkyboo','telejaiba','mizuki_meii','sr_minds','abara_larkspur_vt','kiteruvtber','endlesslevel','hei_cross'];
// Reemplaza esta dirección por la URL pública de tu Cloudflare Worker.
const STATUS_API_URL='';
const list=document.getElementById('channels'), info=document.getElementById('info');
let busy=false;
function render(liveNames=null){
 const ordered=channels.map((name,index)=>({name,index,live:liveNames?.has(name.toLowerCase())??false}));
 if(liveNames)ordered.sort((a,b)=>Number(b.live)-Number(a.live)||a.index-b.index);
 list.replaceChildren();
 for(const item of ordered){
  const li=document.createElement('li');if(item.live)li.className='live';
  const a=document.createElement('a');a.href='https://www.twitch.tv/'+encodeURIComponent(item.name);a.target='_blank';a.rel='noopener noreferrer';
  const name=document.createElement('span');name.className='name';name.textContent=item.name;
  const status=document.createElement('span');status.className='status';status.textContent=liveNames?(item.live?'● EN DIRECTO':'DESCONECTADO'):'ESTADO NO DISPONIBLE';
  a.append(name,status);li.append(a);list.append(li);
 }
}
async function update(){
 if(busy)return;busy=true;
 const button=document.getElementById('refresh');button.disabled=true;
 try{
  if(!STATUS_API_URL)throw new Error('Configura STATUS_API_URL para consultar Twitch');
  const response=await fetch(STATUS_API_URL,{cache:'no-store'});
  if(!response.ok)throw new Error('No se pudo consultar el estado');
  const data=await response.json();
  if(!Array.isArray(data.live))throw new Error('Respuesta inválida');
  const live=new Set(data.live.filter(n=>typeof n==='string').map(n=>n.toLowerCase()));
  render(live);info.textContent=`${live.size} canal(es) en directo · Actualizado ${new Date().toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit'})}`;
 }catch(e){render();info.textContent='Estados no disponibles · Los enlaces siguen funcionando';console.warn(e.message)}
 finally{busy=false;button.disabled=false}
}
document.getElementById('refresh').addEventListener('click',update);
render();update();setInterval(update,120000);
</script></body></html>
